# Builds an installable Android .apk every time changes are uploaded to GitHub.
# When it finishes, the .apk is attached to a new entry on the repository's
# "Releases" page, so it can be downloaded straight onto a phone.
name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Reuse downloaded Android tools from the last build
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip ccache autoconf automake libtool libltdl-dev pkg-config gettext autopoint zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade buildozer "cython==3.0.11"
      - name: Build the APK
        run: buildozer -v android debug
      - name: Keep a copy on the run page
        uses: actions/upload-artifact@v4
        with:
          name: khala-joybug-apk
          path: bin/*.apk
      - name: Publish a download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Khala Joybug build ${{ github.run_number }}
          files: bin/*.apk
