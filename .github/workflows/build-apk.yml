# Builds an installable Android .apk every time changes are uploaded to GitHub.
# When it finishes, the .apk is attached to a new entry on the repository's
# "Releases" page, so it can be downloaded straight onto a phone.
name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Reuse downloaded Android tools from the last build
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}-${{ github.run_number }}
          restore-keys: |
            buildozer-${{ hashFiles('buildozer.spec') }}-
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip ccache autoconf automake libtool libltdl-dev pkg-config gettext autopoint zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade buildozer "cython==3.0.11"
      - name: Build the APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log
      # Runs even when the build fails, so the next attempt does not start
      # from zero.
      - name: Keep the downloaded Android tools for next time
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}-${{ github.run_number }}
      # Puts the end of the build log on a side branch called "build-logs",
      # so a failed build can be diagnosed without opening GitHub.
      - name: Save the build log
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sed 's/\x1b\[[0-9;]*m//g' build.log > "$RUNNER_TEMP/clean.log" || exit 0
          mkdir -p "$RUNNER_TEMP/logs" && cd "$RUNNER_TEMP/logs"
          git init -q -b build-logs
          tail -n 4000 "$RUNNER_TEMP/clean.log" | cut -c1-600 > build-tail.log
          grep -n -i -E 'error|exception|traceback|failed|not found' "$RUNNER_TEMP/clean.log" | cut -c1-500 | tail -n 500 > build-errors.log || true
          git add .
          git -c user.name=github-actions -c user.email=github-actions@github.com commit -q -m "Build log for run $GITHUB_RUN_NUMBER"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" build-logs
      - name: Keep a copy on the run page
        uses: actions/upload-artifact@v4
        with:
          name: khala-joybug-apk
          path: bin/*.apk
      - name: Publish a download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Khala Joybug build ${{ github.run_number }}
          files: bin/*.apk
